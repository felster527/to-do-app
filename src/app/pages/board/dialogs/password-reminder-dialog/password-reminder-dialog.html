@if (open()) {
  <div class="modal-backdrop" (click)="close()">
    <div class="modal" role="alertdialog" aria-modal="true"
      aria-labelledby="reminder-title" aria-describedby="reminder-text"
      (click)="$event.stopPropagation()"
      (keydown.escape)="close()">
      <h2 id="reminder-title" class="modal-title">Security recommendation</h2>

      <p id="reminder-text" class="modal-text">
        Your account is still using its initial temporary password. For your account's safety,
        we recommend setting a new password as soon as possible.
      </p>

      <div class="inline-actions">
        <button class="btn btn-ghost" type="button" (click)="close()">Remind me later</button>
        <button id="reminder-change" class="btn btn-primary" type="button" (click)="changePassword()">
          Change password
        </button>
      </div>
    </div>
  </div>
}
